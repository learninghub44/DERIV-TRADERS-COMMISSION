name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      # This app is configured for Cloudflare Workers (wrangler.jsonc,
      # open-next.config.ts, @opennextjs/cloudflare) - NOT Cloudflare
      # Pages. Pages' own Git auto-deploy only runs `next build` and
      # cannot serve this app's middleware or dynamic API routes at all.
      # This workflow runs the real build (opennextjs-cloudflare build)
      # and deploys the resulting Worker directly via wrangler.
      - name: Build for Cloudflare Workers
        run: npx opennextjs-cloudflare build
        env:
          # Build-time placeholders only - the actual runtime values are
          # set as Worker secrets/vars in the Cloudflare dashboard and
          # apply when the deployed Worker handles real requests.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEXT_PUBLIC_DERIV_APP_ID: ${{ vars.NEXT_PUBLIC_DERIV_APP_ID }}
          NEXT_PUBLIC_DERIV_API_BASE_URL: ${{ vars.NEXT_PUBLIC_DERIV_API_BASE_URL }}
          NEXT_PUBLIC_DERIV_REDIRECT_URI: ${{ vars.NEXT_PUBLIC_DERIV_REDIRECT_URI }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
